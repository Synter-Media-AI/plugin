name: Validate

on:
  pull_request:
    branches:
      - main

jobs:
  validate-manifests:
    name: Validate manifests, skills, and interpolation guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run manifest validation
        run: node scripts/validate-manifests.js
