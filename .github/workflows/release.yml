name: Release

on:
  push:
    tags:
      - 'synter--v*'

permissions:
  contents: write

jobs:
  release:
    name: Validate, build, and publish release zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run manifest validation
        run: node scripts/validate-manifests.js

      - name: Run strict Claude plugin validation
        run: npx -y @anthropic-ai/claude-code@2.1.263 plugin validate . --strict

      - name: Ensure release tag matches manifest version
        run: |
          version=$(node -p "require('./.claude-plugin/plugin.json').version")
          test "$GITHUB_REF_NAME" = "synter--v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          }

      - name: Ensure zip/rsync are available
        run: |
          if ! command -v zip >/dev/null || ! command -v rsync >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zip rsync
          fi

      - name: Build plugin zip
        run: bash scripts/build-zip.sh

      - name: Resolve version
        id: version
        run: echo "version=$(node -p "require('./.claude-plugin/plugin.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/synter-plugin-${{ steps.version.outputs.version }}.zip
            dist/synter-plugin-${{ steps.version.outputs.version }}.zip.sha256
          generate_release_notes: true
